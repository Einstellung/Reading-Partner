[package]
name = "tauri-plugin-health"
version = "0.1.0"
authors = ["Reading-Partner"]
description = "Read the reader's body measurements from Apple Health on iOS, read-only"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
# Cargo turns the `cargo:<key>=<value>` lines this crate's build script prints
# into DEP_TAURI_PLUGIN_HEALTH_<KEY> for the build script of whoever depends on
# it, which is how tauri-build finds `ios/` and `permissions/`. The key has to
# be unique across the dependency graph, hence the crate name.
links = "tauri-plugin-health"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

