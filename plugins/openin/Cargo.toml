[package]
name = "tauri-plugin-openin"
version = "0.1.0"
authors = ["Reading-Partner"]
description = "Hand a file in the app's container to the iOS share sheet, so the reader can open it in another app"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
# Cargo turns the `cargo:<key>=<value>` lines this crate's build script prints
# into DEP_TAURI_PLUGIN_OPENIN_<KEY> for the build script of whoever depends on
# it, which is how tauri-build finds `ios/` and `permissions/`. The key has to
# be unique across the dependency graph, hence the crate name.
links = "tauri-plugin-openin"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
