[default]
description = "Dictate on the device: start, stop and cancel a hold, let the microphone go when voice mode ends, subscribe to the dictation event, park the audio stack for the indicator probe, and interrupt or bench the spoken half."
permissions = [
  "allow-start-dictation",
  "allow-stop-dictation",
  "allow-cancel-dictation",
  "allow-release-microphone",
  "allow-set-indicator-probe",
  "allow-stop-speaking",
  "allow-speech-probe",
  "allow-speech-live",
  "allow-speech-report",
  "allow-register-listener",
  "allow-remove-listener",
]
