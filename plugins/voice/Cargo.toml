[package]
name = "tauri-plugin-voice"
version = "0.1.0"
authors = ["Reading-Partner"]
description = "Native voice capture and on-device speech recognition for the spoken briefing (docs/33)"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
# Cargo turns the `cargo:<key>=<value>` lines this crate's build script prints
# into DEP_TAURI_PLUGIN_VOICE_<KEY> for the build script of whoever depends on
# it, which is how tauri-build finds `ios/` and `permissions/`. The key has to
# be unique across the dependency graph, hence the crate name.
links = "tauri-plugin-voice"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
# The sentence PCM crosses the bridge as a JSON string: serde writes a Vec<u8>
# as an array of numbers, which is six bytes on the wire for every one.
base64 = "0.22"
thiserror = "2"
# CLOCK_MONOTONIC_RAW for the per-sentence marks (tts/player.rs), the clock
# Swift reads too. Already in the graph through tokio.
libc = "0.2"
# The Kokoro weights downloader (src/kokoro/download.rs) fetches over HTTPS from
# Rust. Every crate below is already in the app's dependency graph through
# tauri-plugin-http, and the features are the ones it already builds with, so
# this adds a compile unit to nothing.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
async-trait = "0.1"
# On-device Kokoro TTS (src/kokoro), behind the `kokoro` feature so hosts that
# never run it never link it. The model code is the kokoro-onnx crate, shared
# with the Android voice engine (docs/companion/89); its `ort` feature brings in
# ONNX Runtime (see that crate's manifest).
kokoro-onnx = { path = "../voice-engine/kokoro-onnx" }
# The messages to and from the Android voice process (docs/companion/89).
voice-wire = { path = "../voice-engine/voice-wire" }
# The downloader's check of every model file against the manifest.
sha2 = "0.10"
# Decodes the Kokoro frontend's embedded tables (src/kokoro_g2p/data). BSD-3-Clause/MIT, already in the
# app's graph through tauri's asset compression.
brotli-decompressor = "5"

[features]
kokoro = ["kokoro-onnx/ort"]

[dev-dependencies]
# The far end of the Android socket, run in-process by the end-to-end tests
# (android_e2e.rs) on a virtual device.
voice-engine = { path = "../voice-engine/engine" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
