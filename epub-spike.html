<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EPUB spike harness</title>
    <script>
      // The dev server sends no CSP: in dev the page is the vite server's, and
      // tauri.conf.json's policy only rides on the app protocol's own responses.
      // So the policy under test is injected here instead, before any other
      // element exists, and ?csp= picks which one:
      //   (absent)  no CSP at all — the control
      //   prod      today's tauri.conf.json csp, verbatim but for connect-src
      //   frame     the same with `blob:` added to frame-src only
      //   all       `blob:` on frame-src, style-src and font-src — the proposal
      // connect-src gains the book server on :8901 in all of them, because the
      // books are copyrighted and are served from outside the checkout.
      (function () {
        var which = new URLSearchParams(location.search).get("csp");
        if (!which) return;
        var all = which === "all";
        var csp =
          "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; " +
          "style-src 'self' 'unsafe-inline'" + (all ? " blob:; " : "; ") +
          "img-src 'self' data: blob: img: http://img.localhost https://img.localhost; " +
          "font-src 'self' data:" + (all ? " blob:; " : "; ") +
          "worker-src 'self' blob:; child-src 'self' blob:; " +
          (which === "prod" ? "frame-src 'self'; " : "frame-src 'self' blob:; ") +
          "connect-src 'self' ipc: http://ipc.localhost http://localhost:8901 ws://localhost:1420 ws://localhost:1422";
        var meta = document.createElement("meta");
        meta.httpEquiv = "Content-Security-Policy";
        meta.content = csp;
        document.head.appendChild(meta);
      })();
    </script>
    <style>
      html, body, #root { margin: 0; height: 100%; }
      #root { display: flex; }
      foliate-view { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/reading/epub/spike-harness.tsx"></script>
  </body>
</html>
