[package]
name = "reading-partner"
version = "0.8.24"
description = "AI reading partner"
authors = ["Reading-Partner"]
edition = "2021"

[lib]
name = "reading_partner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Off by default. With it, wry sets WKWebView.isInspectable, which is what lets
# Safari's Web Inspector — or ios_webkit_debug_proxy from a Linux box — attach
# to a release build on a device. An inspectable build exposes everything the
# webview holds, tokens included, to anyone with the device and a debugger, so
# it is a per-build opt-in (the TestFlight workflow's `inspectable` input) and
# must stay off once the app has users other than its author.
[features]
inspectable = ["tauri/devtools"]

[dependencies]
# tray-icon: the collector end has to survive its window being closed (docs/36),
# and the tray is what it is reachable by afterwards. Enabling it everywhere is
# safe — tauri declares the underlying crate only for the desktop targets, so an
# iOS build never sees it, and src/tray.rs is `#[cfg(desktop)]` besides.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# unsafe-headers: lets the fetch bridge send an empty Origin, which the plugin
# treats as "remove the Origin header" — Anthropic's OAuth endpoints reject any
# request that looks like CORS (docs/pitfall/15).
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-opener = "2"
# Receive the Google mobile OAuth redirect: each client's reverse-client-id custom
# scheme is registered in tauri.conf.json (deep-link generates the Info.plist
# CFBundleURLTypes at iOS build time and the AndroidManifest intent-filter at
# Android build time), and the frontend reads the redirect via onOpenUrl/getCurrent.
# Desktop keeps the loopback listener (oauth_callback.rs).
tauri-plugin-deep-link = "2"
# Platform detection to fork the OAuth flow (loopback on desktop, custom scheme on
# iOS and Android); platform() is read synchronously in
# src/platform/sync/googleConfig.ts.
tauri-plugin-os = "2"
# Read images from the system clipboard: WebKitGTK's DOM paste event often
# omits image data, so the shell reads the clipboard through Rust as a fallback.
tauri-plugin-clipboard-manager = "2"
# Decode the image URL the `img:` protocol handler receives as one encoded path
# segment (src/image_proxy.rs), the same way Tauri's own asset protocol does.
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
# generate_context! expands the deep-link plugin config into serde_json values,
# so the app crate needs serde_json as a direct dependency.
serde_json = "1"
# Push-to-talk voice input records the mic in Rust: WebKitGTK's getUserMedia is
# unreliable on Linux (the primary desktop), so cpal captures samples and hound
# encodes a 16 kHz mono WAV for the STT request (docs/15).
cpal = "0.15"
hound = "3.5"

# Start with the machine, if the user asks for it (docs/36). The crate exists
# only for the three desktop platforms, so it is scoped to them rather than
# guarded at the use site; on mobile it is not a dependency at all.
[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
tauri-plugin-autostart = "2"

# Read the rendered DOM back out of the hidden article-fetch webview
# (src/webview_fetch). Tauri's `eval` is fire-and-forget, so the result comes
# through WebKitGTK's own run_javascript callback; `with_webview` hands us
# exactly these types, so the versions are pinned to the ones wry 0.55 links
# against — a different minor would be a second, incompatible GObject binding.
# Linux only: this is the same engine the release .deb/AppImage ship on.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
javascriptcore-rs = "=1.1.2"
# Only for the orphan-window sweep after a sign-in (src/webview_fetch/session.rs):
# wry answers a popup request by building a bare GTK window of its own, which is
# not a Tauri window and cannot be reached any other way. Same version tao and
# wry link against.
gtk = "0.18"

# Full dev rebuilds peak at many GB of linker memory, which has triggered
# systemd-oomd to kill the whole desktop session (docs/pitfall/14).
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
