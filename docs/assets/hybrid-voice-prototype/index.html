<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hybrid Voice Prototype</title>
<style>
:root {
  --background: #faf9f6;
  --foreground: #252922;
  --card: #fffefa;
  --primary: #252922;
  --accent-line: #52664e;
  --secondary: #e9e9e1;
  --secondary-faint: #f1f1ea;
  --muted: #efefe8;
  --muted-soft: #f1f1ea;
  --muted-strong: #e3e3db;
  --muted-foreground: #5c6058;
  --faint-foreground: #6f726a;
  --border: #e5e5dd;
  --lumen-ink: #152a86;
  --radius: 8px;
  --gutter: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; }

.app { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; }

/* Top bar */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) var(--gutter) 10px;
  border-bottom: 1px solid var(--border);
  background: var(--background);
}
.logo { font-family: Georgia, "Noto Serif SC", "Songti SC", serif; font-size: 17px; font-weight: 600; letter-spacing: .01em; }
.topbar .where { color: var(--faint-foreground); font-size: 13px; margin-left: auto; }

/* Prototype narration band */
.proto {
  display: flex; flex-direction: column; gap: 6px;
  padding: 8px var(--gutter);
  background: var(--secondary-faint);
  border-bottom: 1px dashed var(--muted-strong);
  font-size: 12.5px; color: var(--muted-foreground);
}
.proto-row { display: flex; align-items: center; gap: 8px; }
.proto-tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint-foreground); }
.proto-row .spacer { flex: 1; }
.chip-btn {
  border: 1px solid var(--border); background: var(--card); border-radius: 999px;
  padding: 2px 10px; font-size: 12px; cursor: pointer; min-height: 28px;
}
.chip-btn[aria-pressed="true"] { background: var(--secondary); font-weight: 600; }
#narr { min-height: 2.9em; color: var(--foreground); }
#narr b { font-weight: 600; }

/* Briefing page */
.page { flex: 1; overflow: auto; padding: 14px var(--gutter) 160px; }
.page h1 { font-family: Georgia, "Noto Serif SC", "Songti SC", serif; font-size: 22px; margin: 4px 0 2px; font-weight: 600; }
.page .sub { color: var(--faint-foreground); font-size: 13px; margin-bottom: 14px; }
.lab { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
.lab .name { font-size: 12px; color: var(--faint-foreground); }
.lab .head { font-weight: 600; margin: 2px 0 4px; }
.lab .body { color: var(--muted-foreground); font-size: 14px; }

/* Call panel */
.call {
  position: absolute; right: var(--gutter); left: var(--gutter);
  bottom: calc(env(safe-area-inset-bottom) + 104px);
  max-height: min(58vh, 520px);
  display: flex; flex-direction: column;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 10px 30px rgba(37, 41, 34, .10), 0 1px 3px rgba(37, 41, 34, .06);
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity .22s ease, transform .22s ease;
}
.call.on { opacity: 1; transform: none; pointer-events: auto; }
@media (min-width: 640px) { .call { left: auto; width: 440px; } }
.call-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px 14px; border-bottom: 1px solid var(--border); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-line); box-shadow: 0 0 0 3px rgba(82,102,78,.18); }
.call-title { font-weight: 600; font-size: 14px; }
.call-clock { color: var(--faint-foreground); font-size: 12px; font-variant-numeric: tabular-nums; }
.call-head .spacer { flex: 1; }
.hang { border: 1px solid var(--border); background: var(--background); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; min-height: 32px; }
.lines { overflow: auto; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
.line { max-width: 86%; font-size: 14.5px; }
.line.user { align-self: flex-end; background: var(--muted-soft); border-radius: 12px 12px 4px 12px; padding: 6px 10px; }
.line.front { align-self: flex-start; }
.line.front .who { font-size: 11px; color: var(--faint-foreground); display: block; }
.line.partial { color: var(--faint-foreground); }
.order {
  align-self: stretch; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 7px 10px; background: var(--background); font-size: 13px;
}
.order .top { display: flex; gap: 6px; align-items: baseline; }
.order .n { font-weight: 700; color: var(--accent-line); }
.order .kind { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--muted-foreground); }
.order .state { margin-left: auto; font-size: 12px; color: var(--faint-foreground); }
.order .prog { color: var(--faint-foreground); font-size: 12px; margin-top: 2px; }
.order.done .state { color: var(--accent-line); font-weight: 600; }
.choices { display: flex; gap: 8px; align-self: flex-end; }
.choice { border: 1px solid var(--primary); background: var(--card); border-radius: 999px; padding: 6px 14px; min-height: 44px; cursor: pointer; font-size: 14px; }
.choice.primary { background: var(--primary); color: var(--card); }
.reading { align-self: stretch; border-left: 2px solid var(--accent-line); padding: 2px 0 2px 10px; font-size: 14.5px; color: var(--faint-foreground); }
.reading .s.now { color: var(--foreground); background: rgba(82,102,78,.10); border-radius: 3px; }
.reading .s.done { color: var(--foreground); }
.reading .tag { font-size: 11px; color: var(--faint-foreground); display: block; margin-bottom: 2px; }
.sys { align-self: center; font-size: 12px; color: var(--faint-foreground); }

/* Corner: Lumen + case + menu + card column */
.corner {
  position: absolute; right: var(--gutter); bottom: calc(env(safe-area-inset-bottom) + 18px);
  width: 72px; height: 72px; z-index: 5;
}
.pool {
  position: absolute; inset: -26px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(120,160,255,.32), rgba(120,160,255,0));
  opacity: .5; transform: scale(.8); transition: opacity .5s linear, transform .5s linear;
  pointer-events: none;
}
.corner.charging .pool { opacity: 1; transform: scale(1.12); }
.corner.in-call .pool { opacity: .85; transform: scale(1); }
.lumen {
  position: absolute; inset: 0; touch-action: none; cursor: pointer; border: 0; padding: 0; background: none;
  transform-origin: 50% 85%;
  animation: breathe 3.2345s ease-in-out infinite;
}
.lumen img, .lumen svg { position: absolute; inset: 0; width: 100%; height: 100%; }
@keyframes breathe { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.015, .985); } }
.lumen.listening { animation: none; transform: rotate(-3deg) translateY(1px); }
.lumen.thinking { animation: sway 3s ease-in-out infinite; }
@keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
.face { transition: transform .28s ease; }
.lumen.thinking .face { transform: translate(14px, -16px); }
.lumen.scanning .face { animation: scan 2.2s ease-in-out infinite; }
@keyframes scan { 0%,100% { transform: translate(0, 14px); } 15% { transform: translate(-16px, 14px); } 30% { transform: translate(16px, 14px); } 45% { transform: translate(-16px, 14px); } 60% { transform: translate(16px, 14px); } 75% { transform: translate(0, 14px); } }
.lumen.glance .face { transform: translate(-22px, 10px); }
.brow { opacity: 0; transition: opacity .25s; }
.lumen.thinking .brow, .lumen.scanning .brow { opacity: .78; }
.m-smile, .m-flat, .m-open { transition: opacity .2s; }
.m-flat, .m-open { opacity: 0; }
.lumen.thinking .m-smile, .lumen.scanning .m-smile { opacity: 0; }
.lumen.thinking .m-flat, .lumen.scanning .m-flat { opacity: .82; }
.lumen.speaking .m-smile { opacity: 0; }
.lumen.speaking .m-open { opacity: .86; animation: talk .32s ease-in-out infinite alternate; transform-origin: 503px 676px; }
@keyframes talk { from { transform: scaleY(.35); } to { transform: scaleY(1); } }

.case {
  position: absolute; left: -10px; bottom: 9px; width: 25px; height: 26px;
  border: 0; padding: 0; background: none; cursor: pointer;
  opacity: 0; transform: translate(26px, -14px) scale(.6); pointer-events: none;
  transition: transform .55s cubic-bezier(.3,.7,.3,1), opacity .3s;
  z-index: 1;
}
.case img { width: 100%; height: 100%; display: block; }
.case.out { opacity: 1; transform: none; pointer-events: auto; }
.case::before { content: ""; position: absolute; inset: -10px; }
.badge {
  position: absolute; left: -8px; top: -8px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: var(--accent-line); color: var(--background);
  font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;
  box-shadow: 0 0 0 2px var(--background); opacity: 0; transition: opacity .2s .4s;
}
.case.out .badge.has { opacity: 1; }

.menu {
  position: absolute; right: 0; bottom: 82px; width: 148px;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 4px;
  box-shadow: 0 10px 30px rgba(37, 41, 34, .12);
  opacity: 0; transform: translateY(6px) scale(.98); pointer-events: none; transition: opacity .16s, transform .16s;
}
.menu.on { opacity: 1; transform: none; pointer-events: auto; }
.menu button { display: flex; width: 100%; height: 44px; align-items: center; gap: 10px; border: 0; background: none; border-radius: 10px; padding: 0 12px; text-align: left; font-size: 15px; cursor: pointer; }
.menu button:hover, .menu button.hot { background: var(--secondary); }

.column {
  position: absolute; right: 0; bottom: 84px; width: min(320px, calc(100vw - 2 * var(--gutter)));
  display: flex; flex-direction: column; gap: 6px;
  opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .18s, transform .18s;
}
.column.on { opacity: 1; transform: none; pointer-events: auto; }
.card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%;
  border: 1px solid var(--border); background: var(--card); border-radius: 6px; padding: 9px 12px;
  text-align: left; cursor: pointer; min-height: 44px;
  box-shadow: 0 4px 14px rgba(37, 41, 34, .08);
}
.card .cover { font-size: 14px; }
.card .src { font-size: 12px; color: var(--faint-foreground); }

/* Sheet: the original text */
.scrim { position: absolute; inset: 0; background: rgba(37, 41, 34, .18); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 8; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 9;
  max-height: 78%; overflow: auto;
  background: var(--card); border-radius: 16px 16px 0 0; border-top: 1px solid var(--border);
  padding: 10px var(--gutter) calc(env(safe-area-inset-bottom) + 20px);
  transform: translateY(calc(100% + 40px)); visibility: hidden; transition: transform .26s cubic-bezier(.3,.7,.3,1), visibility 0s .26s;
}
@media (min-width: 640px) { .sheet { left: auto; right: var(--gutter); bottom: var(--gutter); width: 460px; border-radius: 16px; border: 1px solid var(--border); } }
.sheet.on { transform: none; visibility: visible; transition: transform .26s cubic-bezier(.3,.7,.3,1); }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--muted-strong); margin: 0 auto 10px; }
.sheet .meta { font-size: 12px; color: var(--faint-foreground); }
.sheet h2 { font-size: 16px; margin: 4px 0 8px; }
.sheet p { margin: 0 0 10px; font-size: 15px; }
.sheet .close { float: right; border: 1px solid var(--border); background: var(--background); border-radius: 999px; padding: 3px 12px; min-height: 32px; cursor: pointer; font-size: 13px; }

@media (prefers-reduced-motion: reduce) {
  .lumen, .lumen.thinking, .lumen.scanning .face, .lumen.speaking .m-open { animation: none !important; }
  .case, .call, .sheet, .menu, .column { transition: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <span class="logo">Reading Partner</span>
    <span class="where">简报 · 10 月 14 日</span>
  </header>

  <div class="proto" aria-live="polite">
    <div class="proto-row">
      <span class="proto-tag">原型 · 脚本假数据</span>
      <span class="spacer"></span>
      <button class="chip-btn" id="speed" aria-pressed="false">2× 速度</button>
      <button class="chip-btn" id="replay">重放</button>
    </div>
    <div id="narr">长按右下角的 Lumen，充满后选「语音」。</div>
  </div>

  <main class="page">
    <h1>今天</h1>
    <div class="sub">三个研究室有变化</div>
    <article class="lab">
      <div class="name">AI 研究室</div>
      <div class="head">一篇论文称：测试时多想几步，小模型能追上大模型</div>
      <div class="body">作者在数学、代码和开放问答三类题上比了多采样加验证器的做法。</div>
    </article>
    <article class="lab">
      <div class="name">芯片研究室</div>
      <div class="head">先进封装产能继续吃紧</div>
      <div class="body">两家封测厂上调了明年的排产计划。</div>
    </article>
    <article class="lab">
      <div class="name">开源研究室</div>
      <div class="head">一个端上语音判停模型发布新版</div>
      <div class="body">int8 约 8 MB，许可 BSD-2。</div>
    </article>
  </main>

  <section class="call" id="call" aria-label="语音通话">
    <div class="call-head">
      <span class="live-dot"></span>
      <span class="call-title">语音</span>
      <span class="call-clock" id="clock">0:00</span>
      <span class="spacer"></span>
      <button class="hang" id="hang">挂断</button>
    </div>
    <div class="lines" id="lines"></div>
  </section>

  <div class="corner" id="corner">
    <div class="pool"></div>
    <div class="column" id="column"></div>
    <div class="menu" id="menu" role="menu">
      <button data-act="voice" role="menuitem">语音</button>
      <button data-act="text" role="menuitem">文字</button>
    </div>

          <path class="brow" d="M 556 415 Q 614 407 672 415" fill="none" stroke="#152a86" stroke-width="12" stroke-linecap="round" transform="rotate(-2 614 415)"/>
          <g>
            <ellipse cx="392" cy="583" rx="62" ry="84" fill="url(#sclera)"/>
            <ellipse cx="392" cy="583" rx="55" ry="76" fill="url(#iris)"/>
            <ellipse cx="392" cy="588" rx="27" ry="39" fill="#070d4a"/>
            <ellipse cx="373" cy="553" rx="16" ry="18" fill="#f7fbff"/>
            <ellipse cx="413" cy="608" rx="8" ry="8" fill="#f7fbff" opacity=".8"/>
          </g>
          <g>
            <ellipse cx="614" cy="583" rx="62" ry="84" fill="url(#sclera)"/>
            <ellipse cx="614" cy="583" rx="55" ry="76" fill="url(#iris)"/>
            <ellipse cx="614" cy="588" rx="27" ry="39" fill="#070d4a"/>
            <ellipse cx="595" cy="553" rx="16" ry="18" fill="#f7fbff"/>
            <ellipse cx="635" cy="608" rx="8" ry="8" fill="#f7fbff" opacity=".8"/>
          </g>
          <path class="m-smile" d="M 448 663 Q 503 691 558 663" fill="none" stroke="#152a86" stroke-width="9" stroke-linecap="round" opacity=".82"/>
          <path class="m-flat" d="M 458 663 L 548 663" fill="none" stroke="#152a86" stroke-width="9" stroke-linecap="round"/>
          <ellipse class="m-open" cx="503" cy="676" rx="32" ry="42" fill="#152a86"/>
        </g>
      </svg>
    </button>
  </div>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" aria-label="原文">
    <div class="grab"></div>
    <button class="close" id="sheetClose">关闭</button>
    <div class="meta">简报 · 10 月 14 日 · 语音里派出的 think</div>
    <h2 id="sheetTitle"></h2>
    <div id="sheetBody"></div>
  </section>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);

  const RESULT = [
    "那篇论文的结论站得住一半。",
    "在数学和代码这类有标准答案的题上，多采样加验证器确实让小模型追上了大模型，对照做得干净。",
    "开放问答只测了一个数据集，提升落在误差范围里，这部分不能外推。",
    "成本只算了推理的 token，没算验证器本身；按它的设置，实际花费约是大模型的一点五倍。",
    "你要是关心省钱，这篇给不出答案；关心能力上限，它说明小模型在能验证的任务上还有余量。",
  ];
  const TASK = "判断那篇「测试时多想几步」论文的结论和方法站不站得住";
  const COVER = RESULT[0];

  // ---- state
  let speed = 1, timers = [], clockTimer = null, callStart = 0;
  let inCall = false, hungUp = false, resultIn = false;
  const box = []; // {id, cover, body, state}
  let run = null;  // {el, state}
  let readingEl = null;

  // ---- tiny helpers
  function narr(html) { $("narr").innerHTML = html; }
  function lumen(state) {
    const el = $("lumen");
    el.className = "lumen" + (state ? " " + state : "");
  }
  function scrollLines() { const l = $("lines"); l.scrollTop = l.scrollHeight; }
  function addLine(kind, text, opts = {}) {
    const d = document.createElement("div");
    d.className = "line " + kind + (opts.partial ? " partial" : "");
    if (kind === "front") d.innerHTML = '<span class="who">Lumen · 前台</span>' + text;
    else d.textContent = text;
    $("lines").appendChild(d); scrollLines(); return d;
  }
  function addSys(text) { const d = document.createElement("div"); d.className = "sys"; d.textContent = text; $("lines").appendChild(d); scrollLines(); }
  function after(sec, fn) { timers.push(setTimeout(fn, (sec * 1000) / speed)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  // ---- the red box
  function renderBox() {
    const open = box.filter((b) => b.state === "in box");
    $("case").classList.toggle("out", open.length > 0);
    const badge = $("badge");
    badge.textContent = open.length ? String(open.length) : "";
    badge.classList.toggle("has", open.length > 0);
    const col = $("column");
    col.innerHTML = "";
    open.forEach((item) => {
      const b = document.createElement("button");
      b.className = "card";
      b.innerHTML = '<span class="cover"></span><span class="src">简报 · 今天 · 语音里问的</span>';
      b.querySelector(".cover").textContent = item.cover;
      b.addEventListener("click", () => openSheet(item));
      col.appendChild(b);
    });
    if (!open.length) col.classList.remove("on");
  }
  function told(item) { item.state = "told"; renderBox(); }

  function openSheet(item) {
    $("column").classList.remove("on");
    $("sheetTitle").textContent = "那篇论文的结论站不站得住";
    $("sheetBody").innerHTML = "";
    const p = document.createElement("p");
    p.textContent = item.body.join("");
    $("sheetBody").appendChild(p);
    $("sheet").classList.add("on"); $("scrim").classList.add("on");
    told(item);
    narr("打开就是 <b>told</b>。卡上是原文，和对话里那条、run 的产出文件是同一份。电话没断。");
  }
  function closeSheet() { $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); }

  // ---- the long press on Lumen
  let pressT = null, pressAt = 0, menuOpen = false;
  $("lumen").addEventListener("pointerdown", (e) => {
    if (inCall) { pressT = setTimeout(() => hangUp(), 500); $("corner").classList.add("charging"); return; }
    if (menuOpen) { closeMenu(); return; }
    pressAt = e.clientX + e.clientY;
    $("corner").classList.add("charging");
    pressT = setTimeout(() => { openMenu(); }, 500);
  });
  const endPress = () => { clearTimeout(pressT); if (!menuOpen) $("corner").classList.remove("charging"); };
  $("lumen").addEventListener("pointerup", endPress);
  $("lumen").addEventListener("pointerleave", endPress);
  function openMenu() { menuOpen = true; $("menu").classList.add("on"); narr("充满，菜单弹出。iPad 没有马达，充能的光就是确认。"); }
  function closeMenu() { menuOpen = false; $("menu").classList.remove("on"); $("corner").classList.remove("charging"); }
  $("menu").addEventListener("click", (e) => {
    const act = e.target.closest("button")?.dataset.act;
    if (!act) return;
    closeMenu();
    if (act === "voice") startCall(); else narr("「文字」打开门口对话。这个原型只演语音。");
  });
  $("case").addEventListener("click", () => { $("column").classList.toggle("on"); });
  $("scrim").addEventListener("click", closeSheet);
  $("sheetClose").addEventListener("click", closeSheet);
  $("hang").addEventListener("click", () => hangUp());

  // ---- the call
  function tickClock() {
    const s = Math.floor(((Date.now() - callStart) / 1000) * speed);
    $("clock").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  function startCall() {
    inCall = true; hungUp = false;
    $("corner").classList.add("in-call"); $("corner").classList.remove("charging");
    $("call").classList.add("on");
    callStart = Date.now(); clockTimer = setInterval(tickClock, 250); tickClock();
    lumen("listening");
    narr("通话开在简报页，<b>deliverTo</b> 就是今天的简报线程。下面先闲聊两轮。");
    script();
  }
  function hangUp() {
    if (!inCall) return;
    inCall = false; hungUp = true;
    clearInterval(clockTimer);
    $("call").classList.remove("on"); $("corner").classList.remove("in-call", "charging");
    lumen(run && run.state === "running" ? "scanning" : "");
    if (run && run.state === "running") narr("挂断不取消 run。结果回来只落盒，不出声。");
    else narr("挂断了。");
  }

  // A user turn: a partial transcript while they speak, then the final text.
  function userSays(t0, text, dur = 1.4) {
    after(t0, () => { if (!inCall) return; lumen("listening"); });
    let el = null;
    after(t0 + 0.2, () => { if (!inCall) return; el = addLine("user", text.slice(0, Math.ceil(text.length * 0.45)) + "…", { partial: true }); });
    after(t0 + dur, () => { if (!inCall || !el) return; el.textContent = text; el.classList.remove("partial"); lumen("thinking"); });
  }
  // A front reply: quick, no thinking.
  function frontSays(t0, text, len = 2.2, next = "listening") {
    after(t0, () => { if (!inCall) return; lumen("speaking"); addLine("front", text); });
    after(t0 + len, () => { if (!inCall) return; lumen(next); });
  }
  function order(t0) {
    after(t0, () => {
      const d = document.createElement("div");
      d.className = "order";
      d.innerHTML = '<div class="top"><span class="n">1</span><span class="kind">delegate · think</span><span class="state">在跑</span></div>' +
        '<div class="task"></div><div class="prog">刚派出</div>';
      d.querySelector(".task").textContent = TASK;
      run = { el: d, state: "running" };
      if (inCall) { $("lines").appendChild(d); scrollLines(); }
    });
  }
  function progress(t0, text) { after(t0, () => { if (run && run.state === "running") run.el.querySelector(".prog").textContent = text; }); }

  function script() {
    userSays(0.8, "早，今天有什么新鲜的？");
    after(2.3, () => inCall && narr("前台秒回：快模型、<b>不开思考</b>、约 4k token 的短上下文。"));
    frontSays(2.8, "早。三个研究室有动静，AI 那边有篇论文挺热闹。");
    userSays(5.6, "哪篇？");
    frontSays(7.2, "说测试时多想几步，小模型就能追上大模型的那篇。");
    userSays(10.2, "它这结论站得住吗？方法有没有问题？", 2.0);
    after(12.3, () => inCall && narr("要推理和查原文，前台答不了：<b>先说一句</b>，同一条回复里调 <b>delegate(kind: think)</b>，回合结束，不等。"));
    frontSays(12.6, "这个我得细看一下，我去查查，你接着说。", 2.4, "scanning");
    order(13.4);
    progress(15, "read_page · arxiv.org 摘要页");
    after(15.5, () => inCall && narr("等待时前台不找话说。双方都没在说，Lumen 演「查」那一段。"));
    userSays(17.5, "好。昨天那本书我读到第三章了。");
    after(19.2, () => inCall && narr("后台在跑，前台照常闲聊。"));
    frontSays(19.6, "第三章挺长的，读着顺吗？");
    progress(21, "read_page · 实验一节");
    userSays(22.6, "还行，就是术语多。");
    frontSays(24.4, "碰到卡住的就划出来问我。", 1.8, "scanning");
    progress(25.5, "web_search · 复现结果");
    userSays(27.4, "论文那个查到哪了？");
    after(29.0, () => inCall && narr("「好了没」读清单里 run 的 <b>progress</b> 那一行，不调工具。"));
    frontSays(29.3, "还在看它的实验部分。", 1.6, "scanning");
    progress(31, "写结论");
    after(35, landResult);
  }

  function landResult() {
    resultIn = true;
    if (run) { run.state = "done"; run.el.classList.add("done"); run.el.querySelector(".state").textContent = "回来了"; run.el.querySelector(".prog").textContent = "原文已追加进简报线程，盒里一项"; }
    const item = { id: "r1", cover: COVER, body: RESULT, state: "in box" };
    box.push(item);
    renderBox();
    const prev = $("lumen").className;
    lumen("glance");
    if (!inCall) {
      narr("已挂断：<b>run-done</b> 不起回合，原文进简报线程，盒里多一项。Lumen 瞟一眼盒子，不出声。");
      setTimeout(() => lumen(""), 900);
      return;
    }
    narr("<b>run-done</b>：程序把原文追加进简报线程，同时放进 Red Box。通话不算「正看着」，照放。");
    setTimeout(() => lumen("listening"), 900);
    after(2.4, () => {
      if (!inCall) return;
      narr("空档到了（自己没在说、用户没在说、超过 2 s），前台说一句，<b>不转述内容</b>。");
      frontSays(0, "刚才那篇论文的事想好了。要我念，还是你自己看？", 2.4);
      after(2.6, () => inCall && offerChoices(item));
    });
  }

  function offerChoices(item) {
    const row = document.createElement("div");
    row.className = "choices";
    row.innerHTML = '<button class="choice" data-c="look">我自己看</button><button class="choice primary" data-c="read">念吧</button>';
    row.addEventListener("click", (e) => {
      const c = e.target.closest("button")?.dataset.c;
      if (!c) return;
      row.remove();
      if (c === "read") readOut(item); else lookYourself(item);
    });
    $("lines").appendChild(row); scrollLines();
    narr("用户开口说「念」或「我自己看」。原型里点一下代替说话。");
  }

  function readOut(item) {
    addLine("user", "念吧。");
    lumen("thinking");
    after(0.6, () => {
      if (!inCall) return;
      narr("<b>read_out(1)</b> 绕过前台模型：原文 → 规范化 → 切句 → 我们的 TTS。念的期间前台 hold。");
      readingEl = document.createElement("div");
      readingEl.className = "reading";
      readingEl.innerHTML = '<span class="tag">念原文</span>' + item.body.map((s, i) => '<span class="s" data-i="' + i + '">' + s + "</span>").join("");
      $("lines").appendChild(readingEl); scrollLines();
      lumen("speaking");
      let t = 0;
      item.body.forEach((s, i) => {
        const len = Math.max(1.4, s.length * 0.12);
        after(t, () => {
          if (!inCall) return;
          readingEl.querySelectorAll(".s").forEach((x) => x.classList.toggle("now", x.dataset.i === String(i)));
          if (i > 0) readingEl.querySelector('.s[data-i="' + (i - 1) + '"]').classList.add("done");
          scrollLines();
        });
        t += len;
      });
      after(t, () => {
        if (!inCall) return;
        readingEl.querySelectorAll(".s").forEach((x) => { x.classList.remove("now"); x.classList.add("done"); });
        lumen("listening");
        told(item);
        narr("念完记 <b>told</b>，盒子空了，Lumen 把盒子放回去。被打断的话项留在盒里，「接着念」从那句开始。");
      });
    });
  }

  function lookYourself(item) {
    addLine("user", "我自己看吧。");
    frontSays(0.5, "好，在盒子里，点开就是。", 1.6);
    after(1.2, () => {
      $("column").classList.add("on");
      narr("<b>show(1)</b>：盒子上方展开卡片列，卡上一句封面。点卡看原文，电话不断。");
    });
  }

  // ---- replay & speed
  function reset() {
    clearTimers(); clearInterval(clockTimer);
    inCall = false; hungUp = false; resultIn = false; run = null; box.length = 0;
    $("lines").innerHTML = ""; $("call").classList.remove("on");
    $("corner").className = "corner"; closeMenu(); closeSheet(); renderBox(); lumen("");
    narr("长按右下角的 Lumen，充满后选「语音」。");
  }
  $("replay").addEventListener("click", reset);
  $("speed").addEventListener("click", () => {
    speed = speed === 1 ? 2 : 1;
    $("speed").setAttribute("aria-pressed", String(speed === 2));
  });

  renderBox();

  // Headless capture hooks: ?run=1 starts the call at once, ?fast=N runs at N×,
  // ?choose=read|look picks for the reader when the question comes.
  const fast = Number(params.get("fast"));
  if (fast > 0) speed = fast;
  if (params.get("run") === "1") startCall();
  const choose = params.get("choose");
  if (choose) {
    const watch = setInterval(() => {
      const b = document.querySelector('.choice[data-c="' + choose + '"]');
      if (b) { clearInterval(watch); setTimeout(() => b.click(), 400 / speed); }
    }, 50);
  }
})();
</script>
</body>
</html>
