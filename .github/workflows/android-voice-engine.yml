# Build libvoice_engine.so (plugins/voice-engine, docs/companion/89) for
# arm64-v8a with scripts/android-voice-engine.sh and check what a phone will
# load: LOAD segments aligned for a 16 KB kernel, libc++ and OpenMP linked in
# rather than needed at run time. Prints the size and the NEEDED list and
# uploads the stripped .so.

name: Android voice engine

on:
  workflow_dispatch:
  # GitHub dispatches only workflows that are on the default branch (404 otherwise);
  # a push to an Android voice branch runs it before it gets there.
  push:
    branches: ["dev/android-voice-*"]

concurrency:
  group: android-voice-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  # The NDK android-apk.yml builds with (r28c, 16 KB page size by default).
  NDK_VERSION: "28.2.13676358"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/voice-engine

      # The action's default `tools` package is gone from Google's repository
      # (pitfall 314); the NDK comes from the step below.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build libvoice_engine.so
        run: scripts/android-voice-engine.sh

      - name: Check the shared object
        run: |
          set -euo pipefail
          SO=plugins/voice/android/src/main/jniLibs/arm64-v8a/libvoice_engine.so
          echo "size: $(stat -c %s "$SO") bytes ($(du -h "$SO" | cut -f1))"
          readelf -hW "$SO" | grep -E 'Class|Machine'
          echo "NEEDED:"
          readelf -dW "$SO" | grep NEEDED
          ALIGNS=$(readelf -lW "$SO" | awk '$1=="LOAD"{print $NF}' | sort -u)
          echo "LOAD align: $(echo $ALIGNS)"
          for a in $ALIGNS; do
            case "$a" in
              0x4000|0x10000) ;;
              *) echo "::error::$SO has a LOAD segment aligned at $a, not 16 KB"; exit 1 ;;
            esac
          done
          if readelf -dW "$SO" | grep NEEDED | grep -E 'libc\+\+_shared\.so|libomp\.so'; then
            echo "::error::$SO needs libc++_shared.so or libomp.so at run time"; exit 1
          fi
          for sym in voice_engine_probe voice_engine_asr_probe OrtGetApiBase llama_backend_init mtmd_init_from_file; do
            readelf -sW --dyn-syms "$SO" | grep -qw "$sym" && echo "symbol $sym: present" || echo "symbol $sym: not exported"
          done
          size -A "$SO" | grep -E '^\.(text|rodata|data\.rel\.ro) ' || true

      # GGML_CPU_ARM_ARCH (scripts/android-voice-engine.sh) must reach ggml-cpu:
      # its cmake cache and compile flags name it, and libggml-cpu.a has
      # dot-product instructions but no i8mm ones. (ONNX Runtime's MLAS
      # dispatches its own dotprod and i8mm kernels at run time, so the .so as
      # a whole proves nothing.)
      - name: Check ggml-cpu's Arm architecture
        run: |
          set -euo pipefail
          OUT=$(ls -d plugins/voice-engine/target/aarch64-linux-android/release/build/llama-cpp-sys-2-*/out | head -1)
          grep -E '^GGML_CPU_ARM_ARCH' "$OUT/build/CMakeCache.txt"
          FLAGS=$(find "$OUT/build" -path '*ggml-cpu.dir/flags.make' | head -1)
          grep -E '^C(XX)?_FLAGS' "$FLAGS"
          grep -q -- '-march=armv8.2-a+dotprod' "$FLAGS" || { echo "::error::ggml-cpu is not built for armv8.2-a+dotprod"; exit 1; }
          OBJDUMP=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump
          "$OBJDUMP" -d --no-show-raw-insn "$OUT/lib/libggml-cpu.a" > ggml-cpu.s
          SDOT=$(grep -cwE 'sdot|udot' ggml-cpu.s || true)
          I8MM=$(grep -cwE 'smmla|ummla|usmmla|usdot' ggml-cpu.s || true)
          echo "libggml-cpu.a: $SDOT dotprod instructions, $I8MM i8mm instructions"
          [ "$SDOT" -gt 0 ] || { echo "::error::no sdot/udot in libggml-cpu.a"; exit 1; }
          [ "$I8MM" -eq 0 ] || { echo "::error::libggml-cpu.a has i8mm instructions"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: libvoice_engine-arm64-v8a
          path: plugins/voice/android/src/main/jniLibs/arm64-v8a/libvoice_engine.so
          if-no-files-found: error
