name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported glibc/webkit pair, so the AppImage and .deb run on
          # more than the runner itself.
          - platform: ubuntu-22.04
            args: ""
          # Apple silicon only; Intel Macs are not built. latest.json then
          # carries darwin-aarch64 and darwin-aarch64-app, no x86_64 keys.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libasound2-dev

      - run: bun install --frozen-lockfile

      # Stage the self-hosted PDFium wasm (gitignored; sourced offline from the
      # @embedpdf/pdfium package installed above).
      - name: Copy PDFium wasm
        shell: bash
        run: bun run wasm

      # Developer ID signing and notarization for the macOS bundle (docs/76).
      # Exported to the job only when the certificate secret exists: tauri
      # treats a set-but-empty APPLE_CERTIFICATE as a certificate to import and
      # fails, so without it the build stays unsigned, as before. Notarization
      # reuses the App Store Connect API key the iOS workflow uses, and is only
      # attempted on a signed build.
      - name: macOS signing and notarization
        if: matrix.platform == 'macos-latest'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::warning::APPLE_CERTIFICATE is not set; the macOS build is unsigned and not notarized."
            exit 0
          fi
          # One line whatever the secret was pasted as: GITHUB_ENV is line-based
          # and the certificate is base64.
          echo "APPLE_CERTIFICATE=$(printf '%s' "$CERT" | tr -d ' \r\n')" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -z "$API_KEY_P8_BASE64" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER" ]; then
            echo "::warning::App Store Connect API key secrets missing; signed but not notarized."
            exit 0
          fi
          mkdir -p ~/private_keys
          printf '%s' "$API_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          echo "APPLE_API_ISSUER=$API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the Vite build; without them shipped binaries have Drive
          # sync disabled. A Desktop OAuth client secret is not confidential
          # (PKCE is the protection), but it still lives in repo secrets.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          # Signs every update bundle (.app.tar.gz, AppImage, deb, rpm, msi,
          # setup.exe) with the updater key, whose public half is in
          # tauri.conf.json (docs/76). The key has no password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Reading Partner ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # latest.json carries a key per installer (linux-x86_64-deb, -rpm,
          # -appimage, windows-x86_64-msi, -nsis, darwin-aarch64-app), and the updater
          # looks up the one it was installed from first. This only picks what
          # the bare windows-x86_64 fallback points at: the setup.exe, which is
          # what the release page offers first.
          updaterJsonPreferNsis: true

  # The fourth product of the same tag: a signed arm64 APK, built once by the
  # reusable Android workflow and attached to the release the desktop
  # matrix just created. `needs: app` is what makes that release exist first —
  # tauri-action creates it, nothing else does. On a workflow_dispatch there is
  # no tag and so no release; release_tag is then empty and the APK is only a
  # workflow artifact.
  android:
    needs: app
    permissions:
      contents: write
    uses: ./.github/workflows/android-apk.yml
    with:
      release_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    secrets: inherit

  # Delete workflow artifacts older than the current release line and the three
  # before it (scripts/prune-artifacts.ts; by version, never by date). `needs`
  # lists every other job. always() only keeps this job from being skipped
  # before its condition is read; the condition then lets it run only when
  # every needed job succeeded, so a failed, skipped or cancelled release
  # deletes nothing. prune-artifacts.yml runs the same script by hand.
  prune-artifacts:
    needs: [app, android]
    if: always() && needs.app.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Prune old artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/prune-artifacts.ts
