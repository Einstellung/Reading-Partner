# Build a signed arm64 Android APK on an Ubuntu runner and verify the signature,
# with no local Android environment. The artifact installs directly on a physical
# phone (allow install from unknown sources). This is the real product line, not
# the smoke build: VITE_SMOKE is unset, so main.tsx mounts the app.
#
# Reusable: release.yml calls it with the tag name so the same build also lands
# on the GitHub release next to the desktop bundles. Called with no tag
# (or dispatched by hand) the APK is a workflow artifact only.
#
# Signing: the release APK is built UNSIGNED, then signed out-of-band with
# apksigner using a keystore restored from repo secrets (base64). This keeps the
# generated gen/android (gitignored, re-initialized each run) untouched — no
# build.gradle.kts patching — and makes the signing step explicit and verifiable.
# The keystore is the app's UPGRADE IDENTITY: replacing it makes a phone refuse to
# install the update over an existing install. Back it up (docs/23-Android落地调研.md).
#
# Google sign-in: only VITE_GOOGLE_ANDROID_CLIENT_ID is injected, and its value is
# written here in the clear. An Android OAuth client has no secret — it is a public
# client bound to the package name and the signing certificate's SHA-1, protected
# by PKCE — so the id is not a credential, same as the iOS workflows. The desktop
# client id and secret are deliberately NOT injected: they belong to a Desktop
# client whose loopback redirect Google does not accept from an Android client, and
# baking a secret into a shipped APK has no upside. Without this variable
# selectAuthFlow() returns null on Android and Settings > Sync shows "Google client
# not configured" with the button disabled.
#
# Independent of android-engine-smoke.yml (the emulator engine gate).

name: Android APK

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Tag of an existing GitHub release to attach the APK to. Empty means artifact only."
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [android-spike]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # NDK r28c, not the image's oldest (27.3.13750724): r28 is the first NDK that
  # links shared libraries with a 16 KB max-page-size by default, and a device
  # with a 16 KB kernel refuses to load a 4 KB-aligned .so. The ubuntu-24.04
  # image preinstalls 27.3.13750724, 28.2.13676358 and 29.0.14206865, so this
  # pin costs no download while stopping an image bump from moving the toolchain
  # under us. See docs/23-Android落地调研.md.
  NDK_VERSION: "28.2.13676358"
  # 36.0.0 rather than the spike's 34.0.0: zipalign only grew -P (page size in
  # KB) in build-tools 35, and 34's zipalign dies on the flag.
  BUILD_TOOLS_VERSION: "36.0.0"
  BUNDLE_ID: com.xinyuan.readingpartner
  # Baked into the Vite build by tauri's beforeBuildCommand (bun run build), which
  # inherits this env. Its reversed form is the deep-link scheme registered in
  # tauri.conf.json, which becomes the Android intent-filter; the two must stay in
  # sync or the redirect lands nowhere.
  VITE_GOOGLE_ANDROID_CLIENT_ID: 379091688229-8mb45l09bamhv2ln623knt4kob14folb.apps.googleusercontent.com

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: oven-sh/setup-bun@v2

      # aarch64-linux-android is the Rust target for arm64 phones; the Gradle
      # "Build Rust Code" task cross-compiles the cdylib for it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Put the SDK command-line tools (sdkmanager) on PATH.
      - uses: android-actions/setup-android@v3

      # Add the pinned NDK and build-tools (apksigner/zipalign live in build-tools).
      - name: Install Android NDK and build-tools
        run: |
          set -euo pipefail
          echo "NDKs already on the image: $(ls "$ANDROID_HOME/ndk" 2>/dev/null | tr '\n' ' ')"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS_VERSION}" "platform-tools" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}" >> "$GITHUB_PATH"

      - run: bun install --frozen-lockfile

      # Self-host pdfium.wasm from node_modules into public/ (vite copies it into
      # dist). Without it the reader cannot start.
      - name: Copy pdfium.wasm
        run: bun run wasm

      # src-tauri/gen/android is gitignored; generate the Gradle project fresh.
      # --ci answers prompts with defaults. Uses NDK_HOME set above.
      - name: Initialize the Android project
        run: bun tauri android init --ci

      # Build the release APK for arm64 only, unsigned. Runs beforeBuildCommand
      # (bun run build), which typechecks and builds the frontend.
      - name: Build the unsigned release APK
        run: bun tauri android build --apk --target aarch64

      # Restore the keystore and sign with apksigner (zipalign first, required for
      # v2+ signatures). Passwords and keystore come from repo secrets.
      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED=$(find src-tauri/gen/android -path '*release*' -name '*.apk' | grep -i unsigned | head -1 || true)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find src-tauri/gen/android -path '*release*' -name '*.apk' | head -1 || true)
          fi
          if [ -z "$UNSIGNED" ]; then
            echo "::error::no release APK produced"; find src-tauri/gen/android -name '*.apk' || true; exit 1
          fi
          echo "unsigned apk: $UNSIGNED"

          KS="$RUNNER_TEMP/release.jks"
          base64 -d <<< "$KEYSTORE_BASE64" > "$KS"

          ALIGNED="$RUNNER_TEMP/aligned.apk"
          SIGNED="$RUNNER_TEMP/signed.apk"
          # -P 16 aligns the uncompressed .so entries on 16 KB so the loader can
          # map them straight out of the zip on a 16 KB-page device.
          zipalign -f -v -P 16 4 "$UNSIGNED" "$ALIGNED" >/dev/null
          apksigner sign \
            --ks "$KS" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" "$ALIGNED"
          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

      # Prove the artifact is a valid, verifiable signed APK before uploading.
      - name: Verify the signature
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs "$SIGNED_APK"
          echo "--- expected signer SHA-256 fingerprint ---"
          keytool -printcert -jarfile "$SIGNED_APK" | grep -i 'SHA256:' || true
          # Confirm package id and that it is a release (non-debuggable) build.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/${BUILD_TOOLS_VERSION}/aapt2)
          BADGING=$("$AAPT" dump badging "$SIGNED_APK" 2>/dev/null || true)
          echo "$BADGING" | grep -q "package: name='${BUNDLE_ID}'" || {
            echo "::error::package id is not ${BUNDLE_ID}"; echo "$BADGING" | head -3; exit 1
          }
          echo "$BADGING" | grep -q "application-debuggable" && {
            echo "::error::release APK is debuggable"; exit 1
          } || true
          echo "verify OK — signed release APK for ${BUNDLE_ID}"

      # A 16 KB-page device (Pixel 8 and later can boot one; newer hardware ships
      # it) refuses to load a shared library whose LOAD segments are aligned on
      # 4 KB. Assert what the NDK actually emitted rather than trusting the pin.
      - name: Assert 16 KB page alignment
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/align"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q -o "$SIGNED_APK" 'lib/*' -d "$WORK"
          BAD=0
          for SO in $(find "$WORK/lib" -name '*.so'); do
            ALIGNS=$(readelf -lW "$SO" | awk '$1=="LOAD"{print $NF}' | sort -u)
            echo "$SO: LOAD align $(echo $ALIGNS)"
            for A in $ALIGNS; do
              case "$A" in
                0x4000|0x10000) ;;
                *) BAD=1 ;;
              esac
            done
          done
          [ "$BAD" -eq 0 ] || {
            echo "::error::a shared library is not aligned for 16 KB pages"; exit 1
          }
          zipalign -c -P 16 -v 4 "$SIGNED_APK" >/dev/null || {
            echo "::error::APK zip entries are not 16 KB aligned"; exit 1
          }
          echo "alignment OK — 16 KB page compatible"

      # Stage the signed APK under a versioned name (marketing version from
      # tauri.conf.json) so downloads self-describe.
      - name: Stage the versioned APK
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          OUT="reading-partner-${VERSION}-android-arm64.apk"
          cp "$SIGNED_APK" "$OUT"
          echo "staged: $OUT ($(du -h "$OUT" | cut -f1))"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      - name: Upload the signed APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      # Only when release.yml called us with a tag. The release is the one
      # tauri-action created for the desktop bundles, so this job must run after
      # it; --clobber keeps a re-run idempotent.
      - name: Attach the APK to the release
        if: inputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release_tag }}" "$APK_NAME" --clobber

      - name: Dump build tree on failure
        if: failure()
        run: find src-tauri/gen/android -maxdepth 6 -name '*.apk' 2>/dev/null || true
